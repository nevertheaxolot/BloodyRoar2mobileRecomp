# Linux FULL (ready-to-play) build for Bloody Roar II Recompiled.
#
# Unlike the "setup-host" build (which ships only the launcher + Generate &
# rebuild wizard), this workflow produces the complete game binaries with the
# recompiled game code compiled in - the Linux equivalent of the Windows zips:
# download -> pick your disc -> play. No toolchain needed on the player side.
#
# The recompiled game C (generated/SLES_017.22_*.c + SCUS_944.24_*.c) is
# derived from the game's copyrighted disc, so it is NEVER committed to this
# public repo. It is injected at build time from a PRIVATE repository via a
# secret PAT (see the README / Actions setup notes). The OpenBIOS backend is
# open-source (MIT) and ships inside the psxrecomp submodule.
#
# Manual trigger only (heavy build; requires the generated-repo secret).

name: Linux full build (ready-to-play)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the artifacts (e.g. 0.5.0). Empty = use VERSION file.'
        required: false
        type: string
        default: ''
      build_japan:
        description: 'Also build and verify the isolated Japan/Asia target'
        required: false
        type: boolean
        default: false

concurrency:
  group: linux-full-build-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build:
    name: linux-x64 ready-to-play
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (submodules are the framework pin)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          if [[ -z "${RAW}" ]]; then
            RAW="$(tr -d '[:space:]' <VERSION)"
          fi
          VER="${RAW#v}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
            echo "::error::invalid version '${RAW}' (want X.Y.Z or vX.Y.Z)"
            exit 1
          fi
          printf '%s\n' "${VER}" >VERSION
          echo "version=${VER}" >>"$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${VER}" >>"$GITHUB_ENV"
          echo "Using version ${VER}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl1-mesa-dev libxtst-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev zip unzip \
            libvulkan-dev glslc ccache

      - name: Cache SDL3 source
        uses: actions/cache@v4
        with:
          path: .cache/sdl3-src
          key: sdl3-3.4.10-src

      - name: Prefetch SDL3 source
        shell: bash
        run: |
          set -euo pipefail
          OUT=".cache/sdl3-src"
          if [[ -f "${OUT}/CMakeLists.txt" ]]; then
            echo "SDL3 source cache hit"
          else
            bash psxrecomp/tools/ci/prefetch_sdl3.sh --out-dir "${OUT}"
          fi
          echo "PSX_SDL3_SOURCE_DIR=${GITHUB_WORKSPACE}/${OUT}" >>"$GITHUB_ENV"

      - name: Restore game generated C from private repo
        shell: bash
        env:
          GENERATED_REPO: ${{ secrets.GENERATED_REPO }}
          GENERATED_REPO_PAT: ${{ secrets.GENERATED_REPO_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${GENERATED_REPO:-}" || -z "${GENERATED_REPO_PAT:-}" ]]; then
            echo "::error::secrets GENERATED_REPO / GENERATED_REPO_PAT are not set." >&2
            echo "::error::Create a private repo with the game generated C and add a PAT secret." >&2
            exit 1
          fi
          rm -rf generated
          git clone --depth 1 \
            "https://x-access-token:${GENERATED_REPO_PAT}@github.com/${GENERATED_REPO}.git" \
            generated
          rm -rf generated/.git
          echo "restored game generated C:"
          ls generated | sed -n '1,6p'

      - name: Verify game generated C present
        shell: bash
        run: |
          set -euo pipefail
          test -f generated/SLES_017.22_dispatch.c || { echo "::error::missing SLES_017.22_dispatch.c"; exit 1; }
          test -f generated/SCUS_944.24_dispatch.c || { echo "::error::missing SCUS_944.24_dispatch.c"; exit 1; }
          test -f generated/SLES_017.22_decls.h || { echo "::error::missing SLES_017.22_decls.h"; exit 1; }
          test -f generated/SCUS_944.24_decls.h || { echo "::error::missing SCUS_944.24_decls.h"; exit 1; }
          EU_COUNT="$(find generated -maxdepth 1 -type f -name 'SLES_017.22_full_*.c' | wc -l)"
          US_COUNT="$(find generated -maxdepth 1 -type f -name 'SCUS_944.24_full_*.c' | wc -l)"
          test "${EU_COUNT}" -gt 0 || { echo "::error::no EU generated C translation units"; exit 1; }
          test "${US_COUNT}" -gt 0 || { echo "::error::no USA generated C translation units"; exit 1; }
          echo "generated C verified: EU=${EU_COUNT} translation units, USA=${US_COUNT} translation units"
          if [[ "${{ github.event.inputs.build_japan }}" == "true" ]]; then
            test -f generated/SLPS_018.42_dispatch.c || { echo "::error::missing SLPS_018.42_dispatch.c"; exit 1; }
            test -f generated/SLPS_018.42_decls.h || { echo "::error::missing SLPS_018.42_decls.h"; exit 1; }
            JP_COUNT="$(find generated -maxdepth 1 -type f -name 'SLPS_018.42_full_*.c' | wc -l)"
            test "${JP_COUNT}" -gt 0 || { echo "::error::no Japan generated C translation units"; exit 1; }
            echo "generated C verified: Japan=${JP_COUNT} translation units"
          fi
          echo "game generated C restored and verified"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-full-${{ steps.version.outputs.version }}
          max-size: 800M

      - name: Build BIOS recompiler (emitter)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S psxrecomp/recompiler -B psxrecomp/recompiler/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build psxrecomp/recompiler/build --target psxrecomp-bios -j"$(nproc)"

      - name: Regenerate OpenBIOS backend (MIT, no BIOS dump needed)
        shell: bash
        run: |
          set -euo pipefail
          (cd psxrecomp && bash tools/regen_bios.sh --config bios/OpenBIOS.toml)
          ls -1 psxrecomp/generated/OpenBIOS_* | head
          test -f psxrecomp/generated/OpenBIOS_full.c || { echo "::error::OpenBIOS_full.c not generated"; exit 1; }
          test -f psxrecomp/generated/OpenBIOS_dispatch.c || { echo "::error::OpenBIOS_dispatch.c not generated"; exit 1; }
          echo "OpenBIOS backend regenerated"

      - name: Configure full game build
        shell: bash
        env:
          VULKAN_SDK: /usr
        run: |
          set -euo pipefail
          EXTRA=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          if command -v glslc >/dev/null 2>&1; then
            EXTRA+=("-DGLSLC_EXE=$(command -v glslc)")
          fi
          EXTRA+=("-DFETCHCONTENT_SOURCE_DIR_SDL3=${PSX_SDL3_SOURCE_DIR}")
          JAPAN=(-DBR2_BUILD_JAPAN=OFF)
          if [[ "${{ github.event.inputs.build_japan }}" == "true" ]]; then
            JAPAN=(-DBR2_BUILD_JAPAN=ON)
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSX_SETUP_WIZARD=ON \
            -DPSX_GAME_VERSION="${RELEASE_VERSION}" \
            "${JAPAN[@]}" \
            "${EXTRA[@]}" 2>&1 | tee build-ci-configure.log
          if ! grep -q 'Vulkan backend: headers' build-ci-configure.log; then
            echo "::error::CMake did not enable PSX_HAVE_VULKAN (see configure log)"
            exit 1
          fi

      - name: Build game binaries
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-ci --target psx-runtime -j"$(nproc)"
          cmake --build build-ci --target psx-runtime-us -j"$(nproc)"
          if [[ "${{ github.event.inputs.build_japan }}" == "true" ]]; then
            cmake --build build-ci --target psx-runtime-japan -j"$(nproc)"
          fi

      - name: Verify binaries and version pin
        shell: bash
        run: |
          set -euo pipefail
          test -x build-ci/BloodyRoar2_Recompiled || { echo "::error::EU binary missing"; exit 1; }
          test -x build-ci/BloodyRoar2_Recompiled_USA || { echo "::error::US binary missing"; exit 1; }
          file build-ci/BloodyRoar2_Recompiled build-ci/BloodyRoar2_Recompiled_USA
          file build-ci/BloodyRoar2_Recompiled | grep -q 'ELF 64-bit.*x86-64' || {
            echo "::error::EU binary is not a Linux x86-64 ELF executable"; exit 1;
          }
          file build-ci/BloodyRoar2_Recompiled_USA | grep -q 'ELF 64-bit.*x86-64' || {
            echo "::error::US binary is not a Linux x86-64 ELF executable"; exit 1;
          }
          if ldd build-ci/BloodyRoar2_Recompiled | grep -q 'not found'; then
            echo "::error::EU binary has unresolved shared-library dependencies"; exit 1;
          fi
          if ldd build-ci/BloodyRoar2_Recompiled_USA | grep -q 'not found'; then
            echo "::error::US binary has unresolved shared-library dependencies"; exit 1;
          fi
          if [[ "${{ github.event.inputs.build_japan }}" == "true" ]]; then
            test -x build-ci/BloodyRoar2_Recompiled_Japan || { echo "::error::Japan binary missing"; exit 1; }
            file build-ci/BloodyRoar2_Recompiled_Japan
            file build-ci/BloodyRoar2_Recompiled_Japan | grep -q 'ELF 64-bit.*x86-64' || {
              echo "::error::Japan binary is not a Linux x86-64 ELF executable"; exit 1;
            }
            if ldd build-ci/BloodyRoar2_Recompiled_Japan | grep -q 'not found'; then
              echo "::error::Japan binary has unresolved shared-library dependencies"; exit 1;
            fi
          fi
          for d in build-ci build-ci/Release; do
            if [[ -f "${d}/psx_game_version.txt" ]]; then
              BUILT="$(tr -d '[:space:]' <"${d}/psx_game_version.txt")"
              BUILT="${BUILT#v}"
              if [[ "${BUILT}" != "${RELEASE_VERSION}" ]]; then
                echo "::error::version pin ${BUILT} != ${RELEASE_VERSION}"
                exit 1
              fi
              echo "version pin ok: ${BUILT} (${d})"
            fi
          done

      - name: Package Linux release zips (ready-to-play)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package_release_linux.sh
          scripts/package_release_linux.sh build-ci "${RELEASE_VERSION}"
          ls -la dist/

      - name: Verify Linux release package contents
        shell: bash
        run: |
          set -euo pipefail
          for ZIP in dist/BloodyRoar2-EU-linux-x64-*.zip dist/BloodyRoar2-US-linux-x64-*.zip; do
            test -f "${ZIP}" || { echo "::error::missing package ${ZIP}"; exit 1; }
            CONTENTS="$(mktemp)"
            unzip -Z1 "${ZIP}" >"${CONTENTS}"
            case "${ZIP}" in
              *EU*)
                grep -qE '(^|/)BloodyRoar2_Recompiled$' "${CONTENTS}"
                grep -qE '(^|/)game\.toml$' "${CONTENTS}"
                ;;
              *US*)
                grep -qE '(^|/)BloodyRoar2_Recompiled_USA$' "${CONTENTS}"
                grep -qE '(^|/)game_us\.toml$' "${CONTENTS}"
                ;;
            esac
            grep -qE '(^|/)bios/openbios\.bin$' "${CONTENTS}"
            grep -qE '(^|/)assets/psxrecomp\.png$' "${CONTENTS}"
            grep -qE '(^|/)mods/bundled/br2\.enhancement\.widescreen/1\.0\.0/manifest\.toml$' "${CONTENTS}"
            rm -f "${CONTENTS}"
            echo "verified package contents: ${ZIP}"
          done
          if [[ "${{ github.event.inputs.build_japan }}" == "true" ]]; then
            ZIP="dist/BloodyRoar2-Japan-linux-x64-*.zip"
            test -f ${ZIP} || { echo "::error::missing Japan package"; exit 1; }
            CONTENTS="$(mktemp)"
            unzip -Z1 ${ZIP} >"${CONTENTS}"
            grep -qE '(^|/)BloodyRoar2_Recompiled_Japan$' "${CONTENTS}"
            grep -qE '(^|/)game_japan\.toml$' "${CONTENTS}"
            grep -qE '(^|/)bios/openbios\.bin$' "${CONTENTS}"
            grep -qE '(^|/)assets/psxrecomp\.png$' "${CONTENTS}"
            grep -qE '(^|/)mods/bundled/br2\.enhancement\.widescreen/1\.0\.0/manifest\.toml$' "${CONTENTS}"
            rm -f "${CONTENTS}"
            echo "verified package contents: ${ZIP}"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: br2-linux-ready-to-play
          path: |
            dist/BloodyRoar2-EU-linux-x64-*.zip
            dist/BloodyRoar2-US-linux-x64-*.zip
            dist/BloodyRoar2-Japan-linux-x64-*.zip
          if-no-files-found: error
          retention-days: 30
