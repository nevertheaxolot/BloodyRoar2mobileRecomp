plugins {
    id 'com.android.application'
}

android {
    namespace 'com.br2recomp.android'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.br2recomp.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-scaffold"

        externalNativeBuild {
            cmake {
                // Mismas banderas que ya validamos en el build de Linux:
                // SDL2 en vez de SDL3, netplay/lobby desactivados (bug
                // real del proyecto), y solo el target psx-android (evita
                // que Gradle intente compilar psx-runtime-us/japan/universal).
                arguments "-DANDROID_STL=c++_shared", "-DPSX_SDL_BACKEND=SDL2", "-DPSX_NETPLAY=OFF", "-DRECOMP_NET_ROOT=/nonexistent"
                cFlags "-UPSX_HAS_LOBBY_CLIENT"
                cppFlags "-std=c++17", "-UPSX_HAS_LOBBY_CLIENT"
                targets "psx-android"
            }
        }
        ndk {
            // Empezamos solo con arm64 (99% de celulares modernos) para
            // acelerar la primera compilación de prueba en Actions.
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            // Apuntamos al CMakeLists.txt real de la raiz del repo (el
            // mismo que ya compila el juego completo en Linux), no al
            // scaffold chico que teniamos antes.
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
