# Bloody Roar II — Japan/Asia (SLPS-01842), isolated bring-up target.
# This is a distinct NTSC-J executable and must not reuse EU/USA generated C.

[game]
name = "Bloody Roar II (Japan/Asia)"
id = "SLPS-01842"
region = "Japan"
players = 2
exe = "disc/SLPS_018.42"
disc = "disc/Bloody Roar 2 - Bringer of the New Age (Japan, Asia).cue"
load_address = "0x8011E800"
entry_pc = "0x80125F34"
text_size = "0x0009F800"
stack_base = "0x801FFFF0"

[prepare_disc]
out_dir = "disc"
bin_name = "Bloody Roar 2 - Bringer of the New Age (Japan, Asia).bin"
cue_name = "Bloody Roar 2 - Bringer of the New Age (Japan, Asia).cue"
boot_exe = "SLPS_018.42"
known_sizes = [552101424]
known_md5 = [
  "e05681ff95d218656b95f5acc5d825dd",
]
known_sha1 = [
  "2274696c309bdf9b4770d853489d4ecfdbaa59d0",
]

[recompiler]
seeds = "seeds/ghidra_funcs_japan.txt"
out_dir = "generated"
strict = true
# Namespace this region's generated symbols so EU/USA/Japan link into one
# universal exe. One distinct prefix per region; see game.toml/game_us.toml.
symbol_prefix = "br2jp_"

# Static audit of the generated C (tools/codegen_audit_game.py --config game_japan.toml).
[audit]
function_starts = "seeds/ghidra_funcs_japan.txt"

[[audit.regions]]
name = "text"
rom_start = "0x0"
rom_end = "0x9F800"
vaddr_base = "0x8011E800"

[runtime]
window_title = "Bloody Roar II Recompiled (Japan/Asia)"
memcard_dir = "saves-japan"
bios_hle = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
offer_vulkan = true

[widescreen]
gte_game_mode = true
squash = true
native_wide = false
precise_nclip = true
offer = true
offer_ultrawide = true
adaptive_view = true

[widescreen.cull]
auto_screen_x = true
screen_w_imms = ["0x200"]
screen_h_imms = ["0x1E0"]

[controller]
default_mode = "digital"
lock_mode = true

[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "fb8bc88c65c75b9b58192af9ae821b8232e06b75bed8fc3747c7833947759def"
