format_version = 5
id = "br2.enhancement.unlock-all"
version = "1.0.0"
name = "Bloody Roar II Unlock All"
author = "NovaPowers"
description = "Unlocks all bonus content (Gado, Shen Long, custom options, movies, pictures) without completing arcade/story/survival modes."
resolver = "declarative"
save_compatibility = "shared"

# All three covered builds of Bloody Roar II are handled. This is a guest-RAM
# flag rewrite (the same effect as the known GameShark `801C.... FFFF` codes)
# applied every VBlank while the feature is on and the game has started. The
# Japan/Asia flags are derived from the NTSC-U table via the shared region base
# delta (USA -> Japan -0x0D10). Netplay sessions disable mods, so a match never
# desyncs from unlock-state differences.

